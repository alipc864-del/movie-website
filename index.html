<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <h1>🎬 Movie Hub</h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Search movies..."
        >

    </header>

    <main>

        <section class="hero">

            <div class="hero-content">
                <span>Featured Movie</span>
                <h2>Avengers: Endgame</h2>
                <p>
                    Earth's mightiest heroes face their greatest challenge.
                </p>

                <button id="watchBtn">▶ Watch Now</button>
            </div>

        </section>

        <section class="movies">

            <h2>Popular Movies</h2>

            <div class="movie-grid">

                <div class="movie-card">
                    <img src="cover1.jpeg" alt="Movie">
                    <div class="movie-info">
                        <h3>Movie One</h3>
                        <span>⭐ 8.5</span>
                        <p>Action</p>
                    </div>
                </div>

                <div class="movie-card">
                    <img src="cover2.jpg" alt="Movie">
                    <div class="movie-info">
                        <h3>Movie Two</h3>
                        <span>⭐ 8.1</span>
                        <p>Adventure</p>
                    </div>
                </div>

                <div class="movie-card">
                    <img src="cover3.jpg" alt="Movie">
                    <div class="movie-info">
                        <h3>Movie Three</h3>
                        <span>⭐ 7.9</span>
                        <p>Drama</p>
                    </div>
                </div>

                <div class="movie-card">
                    <img src="cover4.jpg" alt="Movie">
                    <div class="movie-info">
                        <h3>Movie Four</h3>
                        <span>⭐ 8.7</span>
                        <p>Science Fiction</p>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
